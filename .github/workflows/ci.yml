name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Unit and integration tests (Testcontainers)
        run: mvn -B verify
      - name: Container image
        run: docker build -f ledger-service/Dockerfile -t ledger-service:ci .
