name: ledger

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - max_connections=200
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_timeout=15min
    ports: ["${PG_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:${KAFKA_HOST_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 12
    ports: ["${KAFKA_HOST_PORT:-19092}:19092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  ledger:
    build:
      context: .
      dockerfile: ledger-service/Dockerfile
    image: ledger-service:local
    environment:
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      FLYWAY_TARGET: ${FLYWAY_TARGET:-latest}
      ACCOUNT_CACHE_ENABLED: ${ACCOUNT_CACHE_ENABLED:-true}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-40}
      LOG_FORMAT: ecs
      JAVA_TOOL_OPTIONS: -Xms1g -Xmx2g
    ports: ["${LEDGER_PORT:-8080}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 3s
      timeout: 3s
      retries: 60

volumes:
  pgdata:
